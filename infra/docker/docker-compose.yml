services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tableos
      POSTGRES_PASSWORD: tableos
      POSTGRES_DB: tableos
    ports:
      - "5432:5432"
    volumes:
      - tableos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableos -d tableos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - tableos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tableos_pg_data:
  tableos_redis_data:
