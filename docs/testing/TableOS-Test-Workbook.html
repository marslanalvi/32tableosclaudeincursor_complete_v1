<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TableOS Test Workbook</title>
<style>
:root{--b:#d9dde4;--mut:#5b6472;--pass:#0f7b3f;--fail:#b42318;--block:#b7791f;--na:#6b7280}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;color:#1d2330;font-size:14px;background:#f6f7f9}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--b);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 12px 0 0} header input{border:1px solid var(--b);border-radius:6px;padding:5px 8px;font:inherit;width:140px}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:#fff;border-radius:6px;padding:5px 10px} button.primary{background:#1d2330;color:#fff;border-color:#1d2330}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - var(--hh,60px))}
nav{border-right:1px solid var(--b);background:#fff;padding:10px;position:sticky;top:var(--hh,60px);height:calc(100vh - var(--hh,60px));overflow:auto} .mod,.case{scroll-margin-top:calc(var(--hh,60px) + 10px)}
nav a{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;color:inherit;text-decoration:none;font-size:13px} nav a:hover,nav a.on{background:#eef1f5}
nav .cnt{color:var(--mut);font-size:12px;white-space:nowrap} nav .bad{color:var(--fail);font-weight:600}
main{padding:16px 22px;max-width:1100px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px} .pill{background:#fff;border:1px solid var(--b);border-radius:8px;padding:8px 12px;min-width:110px} .pill b{display:block;font-size:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px} .filters select,.filters input{font:inherit;padding:5px 8px;border:1px solid var(--b);border-radius:6px}
.mod{margin-bottom:22px} .mod h2{font-size:18px;margin:10px 0 2px} .goal{color:var(--mut);margin:0 0 6px}
.setup{background:#f3f7ff;border:1px solid #c9dafb;border-radius:8px;padding:6px 12px;margin:6px 0 10px;font-size:13px}
.case{background:#fff;border:1px solid var(--b);border-radius:10px;padding:10px 14px;margin:8px 0}
.case[data-status=pass]{border-left:5px solid var(--pass)} .case[data-status=fail]{border-left:5px solid var(--fail)} .case[data-status=blocked]{border-left:5px solid var(--block)} .case[data-status=na]{border-left:5px solid var(--na);opacity:.85}
.ch{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .cid{font-family:Consolas,monospace;color:var(--mut)} .tag{font-size:11px;padding:1px 7px;border-radius:9px;background:#eef1f5}
.tag.P1{background:#b42318;color:#fff} .tag.P2{background:#d9480f;color:#fff} .tag.P3{background:#5b6472;color:#fff}
.case ol{margin:6px 0 6px 20px;padding:0} .exp{background:#f2faf4;border-left:3px solid var(--pass);padding:5px 9px;margin:6px 0;font-size:13px}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0} .st button.on[data-v=pass]{background:var(--pass);color:#fff} .st button.on[data-v=fail]{background:var(--fail);color:#fff} .st button.on[data-v=blocked]{background:var(--block);color:#fff} .st button.on[data-v=na]{background:var(--na);color:#fff} .st button.on[data-v=""]{background:#eef1f5}
.st select{font:inherit;padding:4px 6px;border:1px solid var(--b);border-radius:6px}
textarea{width:100%;min-height:58px;font:inherit;border:1px solid var(--b);border-radius:6px;padding:6px 8px;resize:vertical}
.drop{margin-top:6px;border:1.5px dashed #aab1bd;border-radius:8px;padding:8px;color:var(--mut);font-size:12.5px;outline:none} .drop:focus,.drop.over{border-color:#1d2330;background:#f6f7f9}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px} .thumbs figure{margin:0;position:relative} .thumbs img{height:90px;border:1px solid var(--b);border-radius:6px;cursor:zoom-in;display:block}
.thumbs button{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px}
.saved{color:var(--mut);font-size:12px} dialog{border:none;border-radius:10px;padding:0;max-width:92vw} dialog img{max-width:92vw;max-height:88vh;display:block}
details.intro{background:#fff;border:1px solid var(--b);border-radius:10px;padding:8px 14px;margin-bottom:12px} details.intro table{border-collapse:collapse;margin:6px 0;font-size:13px} details.intro td,details.intro th{border:1px solid var(--b);padding:3px 7px;text-align:left}
.hidden{display:none}
</style></head><body>
<header>
  <h1>TableOS Test Workbook</h1>
  <input id="m-tester" placeholder="Tester name">
  <input id="m-env" placeholder="Environment URL">
  <input id="m-version" placeholder="TableOS version">
  <input id="m-browser" placeholder="Browser / device">
  <span style="flex:1"></span>
  <span class="saved" id="saved">Saved in this browser</span>
  <button class="primary" id="export-json" title="One file with every result, note and screenshot, for the developer">Export for developer</button>
  <button id="export-html" title="A readable report to share">Export report</button>
  <button id="import" title="Load an exported file (e.g. on another computer)">Import</button>
  <input type="file" id="import-file" accept=".json,application/json" class="hidden">
</header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>

<script id="plan" type="application/json">{"planVersion":"2.0","appVersion":"0.16.7","generated":"2026-10-22","accounts":[["OWNER","Owner","ai.deptbcc@bluecascade.org (the account from the fresh start)"],["OWNER2","Second Owner","A second Owner, invited by OWNER as Owner"],["ADMIN","Admin","Invited by OWNER as Admin; give it Creator on workspace WS-A only"],["CREATOR","Member, base Creator","Invited to base BASE-1 as Creator"],["EDITOR","Member, base Editor","Invited to base BASE-1 as Editor"],["COMMENTER","Member, base Commenter","Invited to base BASE-1 as Commenter"],["VIEWER","Member, workspace Viewer","Invited to workspace WS-A as Viewer (all its bases)"],["DOMAIN","Member via allowed domain","Signs up with an @bluecascade.org (or allowed) email without an invitation"],["OUTSIDER","No account","An email that is not invited and not on an allowed domain"]],"data":[["WS-A","Workspace “Sales” created by OWNER"],["WS-B","Workspace “Finance” created by OWNER"],["BASE-1","Base “CRM” in WS-A with tables Contacts, Companies, Deals"],["BASE-2","Base “Budget” in WS-B"],["CSV-S","A small CSV (20 rows, 6 columns: text, number, date, email, select-like, checkbox)"],["CSV-L","A large CSV (5,000+ rows) for background import"],["XLSX","An Excel file with two sheets"],["CSV-BAD","A CSV with invalid emails, phone numbers and dates mixed in"],["IMG","A few images (PNG/JPG, one larger than 5 MB) and a PDF"]],"howTo":["Work module by module (M00 first). Each module is independent once M00 is done.","For every case: follow the steps, compare with Expected, then mark Pass, Fail, Blocked (can’t run it because something else is broken) or N/A (feature not used).","For a failure: pick a severity, write what actually happened (and what you expected), and attach screenshots (paste with Ctrl+V, drag in, or choose files).","Priority: P1 must work (blocker if broken), P2 important, P3 polish.","Use the interactive workbook (TableOS-Test-Workbook.html): it saves automatically in your browser. When done (or at any point), click “Export for developer” and send that one file; it contains every result, note and screenshot.","Found a problem no case covers? Add it under “Other findings” at the end of the workbook."],"severity":[["Critical","Data loss, security hole, or nobody can work."],["High","A main feature is broken with no workaround."],["Medium","Broken but there is a workaround, or a secondary feature fails."],["Low","Cosmetic, wording, small inconvenience."]],"modules":[{"id":"M00","title":"Environment and test accounts","goal":"Get everything the other modules need, and record what you test against.","setup":["Use a desktop browser (Chrome or Edge, latest) for OWNER, and a second browser or a private window for every other account.","Install an authenticator app on your phone (Google Authenticator, Microsoft Authenticator, Authy…). Every account needs two-factor."]},{"id":"M01","title":"Sign-up and invitations","goal":"Only invited people (or allowed email domains) can create accounts; nobody gets a personal organization.","setup":["OUTSIDER and DOMAIN are not signed in. Allowed domains are set in M07 first if you test DOMAIN here."]},{"id":"M02","title":"Sign-in, two-factor and sessions","goal":"Sign-in always needs the password and a two-factor code; sessions end after 30 idle days.","setup":[]},{"id":"M03","title":"Sign-in security: wrong passwords and alerts","goal":"Five wrong passwords lock an account for 15 minutes; Owners are alerted with email and IP.","setup":["Use the EDITOR account. Have OWNER signed in elsewhere to watch the bell."]},{"id":"M04","title":"Account types: Owner, Admin, Member","goal":"Only Owners change account types; several Owners; transfer; at least one Owner always remains.","setup":[]},{"id":"M05","title":"Members & access: invites, roles, end dates","goal":"One invite form everywhere; roles per workspace or base; Admins only within their reach.","setup":[]},{"id":"M06","title":"Device approval","goal":"With device approval on, every non-Owner needs each browser approved.","setup":["Security → Require device approval is on (default)."]},{"id":"M07","title":"Security settings and Activity log","goal":"Allowed sign-up domains and the audit trail.","setup":[]},{"id":"M08","title":"Workspaces","goal":"Only Owners and Admins create workspaces; rename and delete with a warning.","setup":[]},{"id":"M09","title":"Bases","goal":"Create, rename, duplicate, move, delete and restore bases.","setup":[]},{"id":"M10","title":"Tables","goal":"Add, rename, duplicate, hide, delete and restore tables.","setup":[]},{"id":"M11","title":"Fields and field types","goal":"Every field type stores, shows and converts values correctly.","setup":["Use a scratch table in BASE-1. For each type: create the field, enter 3 values (normal, empty, edge), refresh, then convert to Single line text and back where it makes sense."]},{"id":"M12","title":"Editing records in the grid","goal":"Fast, correct editing with mouse and keyboard.","setup":[]},{"id":"M13","title":"Comments, mentions and history","goal":"Discuss records and see who changed what.","setup":[]},{"id":"M14","title":"Undo, redo and trash","goal":"Mistakes can be reversed.","setup":[]},{"id":"M15","title":"Views","goal":"Every view type and the view toolbar; the default Grid view can never be deleted.","setup":[]},{"id":"M16","title":"Links, lookups, rollups and counts","goal":"Relationships between tables, including across bases.","setup":[]},{"id":"M17","title":"Formulas","goal":"Formula fields compute correctly and report errors clearly.","setup":[]},{"id":"M18","title":"Synced tables from another base","goal":"Read-only copies that stay up to date.","setup":[]},{"id":"M19","title":"Connectors: Airtable, HubSpot, Gmail, Slack","goal":"External data and messaging.","setup":["Needs real accounts/tokens for each service. Skip (mark N/A) any service you don’t use."]},{"id":"M20","title":"Import and export","goal":"Files in and out; export is for Owners and Admins only.","setup":[]},{"id":"M21","title":"Attachments","goal":"Upload, preview, download, limits.","setup":[]},{"id":"M22","title":"Forms","goal":"Collect records from anyone with the link.","setup":[]},{"id":"M23","title":"Interfaces","goal":"Dashboards and app pages on top of the data.","setup":[]},{"id":"M24","title":"Automations","goal":"Triggers, actions, tests, run history, Runs as and limits.","setup":[]},{"id":"M25","title":"Public share links","goal":"Read-only links for people outside TableOS, Creators and up only.","setup":[]},{"id":"M26","title":"Search, notifications and contacts","goal":"Find things and stay informed.","setup":[]},{"id":"M27","title":"Live collaboration (realtime)","goal":"Changes appear for everyone without refreshing.","setup":["Open BASE-1 as OWNER in one browser and as EDITOR (and ADMIN) in another, side by side."]},{"id":"M28","title":"API and access tokens","goal":"The public record API, token scopes and errors.","setup":["Use curl, Postman or similar. Token from Members & access → API tokens. Base URL = the TableOS address with no trailing slash; send the token as Authorization: Bearer tos_…. Find table IDs in the table tab menu → IDs & API, or with GET /v1/api/bases."]},{"id":"M29","title":"Limits and performance","goal":"TableOS behaves well at its limits and with real amounts of data.","setup":[]},{"id":"M30","title":"Permission matrix spot checks","goal":"One pass through the roles to make sure each sees exactly what it should.","setup":["For each row, sign in as that account and try the action in BASE-1 (and WS-B where noted)."]},{"id":"M31","title":"Help, UI and browsers","goal":"Everything is understandable and works across browsers and screen sizes.","setup":[]}],"cases":[{"id":"M00-01","module":"M00","title":"Record the version under test","steps":["Open Help → Release notes.","Open \u003cAPI>/v1/version in a browser tab."],"expected":"Both show the same version (0.16.7 or later; never 0.0.0). Note it at the top of this workbook.","priority":"P1","kind":"UI"},{"id":"M00-02","module":"M00","title":"OWNER signs in for the first time","steps":["Sign in as OWNER with the agreed password."],"expected":"You are taken to “Set up two-factor sign-in” and nothing else opens until it is done.","priority":"P1","kind":"Security"},{"id":"M00-03","module":"M00","title":"OWNER sets up two-factor","steps":["Click Set up two-factor authentication.","Scan the QR code with the authenticator app.","Enter the 6-digit code and Turn on."],"expected":"Two-factor turns on and TableOS opens Home. Account → Two-factor shows On and has no “Turn off” option.","priority":"P1","kind":"Security"},{"id":"M00-04","module":"M00","title":"Create the test workspaces and base","steps":["As OWNER create WS-A and WS-B on Home.","In WS-A create BASE-1 with tables Contacts, Companies, Deals; in WS-B create BASE-2."],"expected":"All appear on Home under the right workspace.","priority":"P1","kind":"Data"},{"id":"M00-05","module":"M00","title":"Invite the test accounts","steps":["Members & access → People → invite each account from the Accounts table with the stated account type and access.","Each person opens the invitation email (or the copied link), creates an account and sets up two-factor."],"expected":"Every account can sign in and sees only what it was given.","priority":"P1","kind":"UI"},{"id":"M00-06","module":"M00","title":"Prepare the test files","steps":["Create CSV-S, CSV-L, XLSX, CSV-BAD and IMG on your computer."],"expected":"Files ready for M20–M22.","priority":"P2","kind":"Data"},{"id":"M01-01","module":"M01","title":"Sign-up page explains invitations","steps":["Open /signup while signed out."],"expected":"The page says TableOS accounts are by invitation.","priority":"P3","kind":"UI"},{"id":"M01-02","module":"M01","title":"Stranger can't sign up","steps":["Sign up with the OUTSIDER email."],"expected":"Refused: “TableOS accounts are by invitation only…”. No account is created.","priority":"P1","kind":"Security"},{"id":"M01-03","module":"M01","title":"Invited person signs up from the link","steps":["Invite a new email to BASE-1 as Viewer.","Open the invitation link signed out → Sign up with that email."],"expected":"Account created, invitation accepted, the person lands on two-factor setup, then sees only BASE-1.","priority":"P1","kind":"UI"},{"id":"M01-04","module":"M01","title":"Invitation for the wrong account","steps":["While signed in as EDITOR, open an invitation sent to another email."],"expected":"TableOS says the invitation was sent to another address and asks to sign in with it.","priority":"P2","kind":"Security"},{"id":"M01-05","module":"M01","title":"Expired or cancelled invitation","steps":["Cancel a pending invitation in Members & access, then open its link."],"expected":"The link shows “expired or revoked”.","priority":"P2","kind":"Security"},{"id":"M01-06","module":"M01","title":"Allowed-domain sign-up","steps":["With @bluecascade.org in allowed domains (M07), sign up as DOMAIN without an invitation."],"expected":"Account created as Member with no access. OWNER and Admins get a bell notification “New member: …”.","priority":"P1","kind":"Security"},{"id":"M01-07","module":"M01","title":"No personal organization","steps":["After any sign-up above, open the account menu → Members & access, and Home."],"expected":"No organization or “Home” workspace of their own was created.","priority":"P1","kind":"Security"},{"id":"M01-08","module":"M01","title":"Invitation with an account type","steps":["As OWNER invite an email as Admin with “No workspace or base yet”. Open the link signed out."],"expected":"The invitation page says “You’ll join as Admin”. After accepting, the person is Admin.","priority":"P2","kind":"UI"},{"id":"M01-09","module":"M01","title":"Re-invite never lowers an account type","steps":["Invite ADMIN again as a Member to a base and accept it."],"expected":"ADMIN is still Admin, with the extra base access.","priority":"P2","kind":"Security"},{"id":"M02-01","module":"M02","title":"Sign in with code","steps":["Sign out, sign in as EDITOR with password, enter the authenticator code."],"expected":"Signed in. A wrong code shows “Invalid authentication code”.","priority":"P1","kind":"Security"},{"id":"M02-02","module":"M02","title":"Too many wrong codes","steps":["Enter a wrong two-factor code 5 times."],"expected":"The sign-in attempt expires and you must enter the password again.","priority":"P2","kind":"Security"},{"id":"M02-03","module":"M02","title":"Two-factor can't be turned off","steps":["Account → Two-factor authentication."],"expected":"Shows On and a note that it can't be turned off. No turn-off form.","priority":"P1","kind":"Security"},{"id":"M02-04","module":"M02","title":"Show password","steps":["On sign-in, sign-up and Change password click the eye icon."],"expected":"The password becomes visible and hides again.","priority":"P3","kind":"UI"},{"id":"M02-05","module":"M02","title":"Change password","steps":["Account → Password → change it."],"expected":"Saved. Other sessions of that account are signed out; the current one stays.","priority":"P2","kind":"Security"},{"id":"M02-06","module":"M02","title":"Sessions list","steps":["Account → Sessions: sign in from a second browser, then “Sign out other sessions”."],"expected":"Both sessions listed with browser and IP; the other browser is signed out on its next action.","priority":"P2","kind":"Security"},{"id":"M02-07","module":"M02","title":"Session ends after 30 idle days","steps":["(Optional, needs database access) Ask the developer to age a session past 30 days, then use it."],"expected":"You are sent to the sign-in page. Activity within 30 days keeps you signed in.","priority":"P3","kind":"Security"},{"id":"M02-08","module":"M02","title":"Back after signing in","steps":["Signed out, open a deep link (a base URL). Sign in."],"expected":"After sign-in (and two-factor) you land on that base.","priority":"P2","kind":"UI"},{"id":"M02-09","module":"M02","title":"Google sign-in (if enabled)","steps":["Click Sign in with Google with an invited Google account."],"expected":"Signs in; two-factor is still required.","priority":"P3","kind":"Security"},{"id":"M02-10","module":"M02","title":"Return to the page after signing in","steps":["Open a base and table.","Account menu → Log out.","Sign in again (with two-factor)."],"expected":"You land back on that base and table, not Home.","priority":"P2","kind":"UI"},{"id":"M02-11","module":"M02","title":"Two-factor setup page","steps":["With two-factor required, sign in with an account that hasn’t set it up.","Press Back; open TableOS in a new tab."],"expected":"The page shows who is signed in, a Sign out button at the top and explains that every page opens it until two-factor is set up.","priority":"P3","kind":"UI"},{"id":"M03-01","module":"M03","title":"Attempts 1–2: no warning","steps":["Enter a wrong password twice for EDITOR."],"expected":"Plain “Incorrect email or password”.","priority":"P2","kind":"Security"},{"id":"M03-02","module":"M03","title":"Attempts 3–4: warning","steps":["Enter a wrong password a 3rd and 4th time."],"expected":"A warning with attempts left (e.g. “2 attempts left”).","priority":"P1","kind":"Security"},{"id":"M03-03","module":"M03","title":"Attempt 5: locked 15 minutes","steps":["Enter a wrong password a 5th time, then the right one."],"expected":"Account locked with a countdown; the right password is refused while locked.","priority":"P1","kind":"Security"},{"id":"M03-04","module":"M03","title":"Owner alerts","steps":["Check OWNER’s bell and email."],"expected":"One alert per wrong attempt with the email tried, IP, browser, time and “Wrong password n of 5”, plus a lock alert.","priority":"P1","kind":"Security"},{"id":"M03-05","module":"M03","title":"Owner is never locked","steps":["Enter OWNER’s password wrong 6 times (in a private window)."],"expected":"OWNER is not locked (the general rate limit of 10 tries per 15 minutes per IP still applies).","priority":"P2","kind":"Security"},{"id":"M03-06","module":"M03","title":"Unlock after 15 minutes","steps":["Wait 15 minutes, sign in as EDITOR with the right password."],"expected":"Works and resets the count.","priority":"P2","kind":"Security"},{"id":"M04-01","module":"M04","title":"Account types offered","steps":["As OWNER open Members & access → People → Invite."],"expected":"Account type list is exactly Member, Admin, Owner.","priority":"P1","kind":"UI"},{"id":"M04-02","module":"M04","title":"Owner changes an account type","steps":["Change EDITOR to Admin and back to Member with the Account type select."],"expected":"Confirmation, then the badge changes; Activity log records it.","priority":"P1","kind":"UI"},{"id":"M04-03","module":"M04","title":"Admin can't change account types","steps":["As ADMIN open People."],"expected":"No Account type selects and no Transfer ownership.","priority":"P1","kind":"Security"},{"id":"M04-04","module":"M04","title":"Second Owner","steps":["Invite OWNER2 as Owner; accept."],"expected":"OWNER2 sees every workspace and base, and Members & access.","priority":"P1","kind":"Security"},{"id":"M04-05","module":"M04","title":"Owner steps down (two Owners)","steps":["As OWNER2 set your own account type to Admin."],"expected":"Allowed while another active Owner exists.","priority":"P2","kind":"UI"},{"id":"M04-06","module":"M04","title":"Last Owner can't step down","steps":["With a single Owner, try to make yourself Admin."],"expected":"Refused: the organization needs at least one Owner.","priority":"P1","kind":"Security"},{"id":"M04-07","module":"M04","title":"Transfer ownership","steps":["As OWNER click Transfer ownership on OWNER2 (or a Member) and confirm."],"expected":"They become Owner and you become Admin. (Restore afterwards.)","priority":"P2","kind":"UI"},{"id":"M04-08","module":"M04","title":"Admin data access is only what is given","steps":["As ADMIN (Creator on WS-A only) open Home."],"expected":"ADMIN opens WS-A’s bases but not WS-B’s; WS-B is listed by name (rename/delete only).","priority":"P1","kind":"Security"},{"id":"M04-09","module":"M04","title":"Billing is Owner-only","steps":["As ADMIN look for plan/billing options or call the billing endpoint."],"expected":"Not available to Admins.","priority":"P3","kind":"Security"},{"id":"M05-01","module":"M05","title":"Invite to selected bases","steps":["Invite with “Selected bases only”, tick two bases, role Editor."],"expected":"The person sees exactly those two bases, as Editor.","priority":"P1","kind":"UI"},{"id":"M05-02","module":"M05","title":"Invite to a whole workspace","steps":["Invite with “Workspace · WS-A (all its bases)”, role Viewer."],"expected":"The person sees every base in WS-A, read-only.","priority":"P1","kind":"UI"},{"id":"M05-03","module":"M05","title":"Workspace Owner role","steps":["Give CREATOR the Workspace Owner role on WS-B.","As CREATOR: rename WS-B, edit a base’s fields in WS-B, try Create a base in WS-B."],"expected":"Rename (and delete) WS-B works and CREATOR is Creator on every base in it; creating bases still needs Owner or Admin.","priority":"P2","kind":"Security"},{"id":"M05-04","module":"M05","title":"Home Share uses the same form","steps":["On Home click Share on WS-A."],"expected":"The same invite form, starting with the whole workspace; the member list below.","priority":"P2","kind":"UI"},{"id":"M05-05","module":"M05","title":"Change a role","steps":["Edit access → change a base role from Editor to Viewer."],"expected":"The person can no longer edit (refresh their page).","priority":"P1","kind":"Security"},{"id":"M05-06","module":"M05","title":"Base role overrides workspace role","steps":["VIEWER has Viewer on WS-A. Set BASE-1 to Editor for VIEWER, and another base to “No access to this base”."],"expected":"VIEWER edits BASE-1, can't see the blocked base, still reads the others.","priority":"P1","kind":"Security"},{"id":"M05-07","module":"M05","title":"Access end date","steps":["Set “Access until” to tomorrow on a grant."],"expected":"Shown as time-limited; after the date the access disappears.","priority":"P2","kind":"Security"},{"id":"M05-08","module":"M05","title":"Bulk change","steps":["Tick several rows in Edit access and Apply a role to selected."],"expected":"All selected rows change.","priority":"P2","kind":"UI"},{"id":"M05-09","module":"M05","title":"Suspend and reactivate","steps":["Suspend EDITOR, try to open BASE-1 as EDITOR, then reactivate."],"expected":"Suspended: nothing opens. Reactivated: access back with the same roles.","priority":"P1","kind":"Security"},{"id":"M05-10","module":"M05","title":"Remove from organization","steps":["Remove a test Member."],"expected":"All their access and devices here are gone.","priority":"P1","kind":"Security"},{"id":"M05-11","module":"M05","title":"Admin manages Members within reach","steps":["As ADMIN invite a Member to WS-A; change their role; suspend them."],"expected":"All allowed.","priority":"P1","kind":"Security"},{"id":"M05-12","module":"M05","title":"Admin limits","steps":["As ADMIN try: invite to WS-B, give a role above Creator, change OWNER’s or another Admin’s access, change your own access, invite an Admin."],"expected":"Each is refused with a clear message.","priority":"P1","kind":"Security"},{"id":"M05-13","module":"M05","title":"Admin sees only what they manage","steps":["As ADMIN open Members & access."],"expected":"Only WS-A (and its bases) appear in the invite form and access matrix.","priority":"P1","kind":"Security"},{"id":"M05-14","module":"M05","title":"Member can't open Members & access","steps":["As EDITOR open the account menu → Members & access."],"expected":"“Only Owners and Admins can manage access.”","priority":"P1","kind":"Security"},{"id":"M05-15","module":"M05","title":"Pending invitations","steps":["Check the invitations list; cancel one."],"expected":"Listed with role and expiry; cancelled invitation link stops working.","priority":"P2","kind":"UI"},{"id":"M05-16","module":"M rs/Admins/Workspace Owners see emails.","priority":"P2","kind":"Security"},{"id":"M26-07","module":"M26","title":"Search palette closes","steps":["Ctrl+K; click the Esc button; Ctrl+K again and press Esc; also after clicking inside the list."],"expected":"The palette closes every time.","priority":"P3","kind":"UI"},{"id":"M27-01","module":"M27","title":"Live cell edits","steps":["OWNER edits a cell."],"expected":"EDITOR sees it within about a second, without refreshing. And the other way round.","priority":"P1","kind":"Realtime"},{"id":"M27-02","module":"M27","title":"Live rows","steps":["Add and delete rows in one browser."],"expected":"Appear/disappear in the other.","priority":"P1","kind":"Realtime"},{"id":"M27-03","module":"M27","title":"Live schema","steps":["Add, rename, delete a field; create a view."],"expected":"Other browser updates.","priority":"P2","kind":"Realtime"},{"id":"M27-04","module":"M27","title":"Presence","steps":["Both open the same table."],"expected":"Avatars of who is here at the top.","priority":"P2","kind":"Realtime"},{"id":"M27-05","module":"M27","title":"Same cell at once","steps":["Both edit the same cell at the same time."],"expected":"Last write wins without errors; both end with the same value.","priority":"P2","kind":"Realtime"},{"id":"M27-06","module":"M27","title":"Reconnect","steps":["Turn Wi-Fi off for 30 seconds in one browser, make changes in the other, turn it on."],"expected":"The first browser catches up automatically.","priority":"P2","kind":"Realtime"},{"id":"M27-07","module":"M27","title":"Different roles","steps":["VIEWER watches while EDITOR edits."],"expected":"VIEWER sees live changes but can’t edit.","priority":"P2","kind":"Realtime"},{"id":"M28-01","module":"M28","title":"Create a token","steps":["Create tokens: Read only; Read+Write; Read+Write+Delete; one limited to BASE-1; one with an expiry."],"expected":"Token shown once; listed with types, bases, expiry.","priority":"P1","kind":"API"},{"id":"M28-02","module":"M28","title":"List bases","steps":["GET /v1/api/bases with the token."],"expected":"Only reachable bases with tables and IDs.","priority":"P1","kind":"API"},{"id":"M28-03","module":"M28","title":"Schema","steps":["GET /v1/bases/{baseId} and GET /v1/tables/{tableId}."],"expected":"Tables and fields.","priority":"P2","kind":"API"},{"id":"M28-04","module":"M28","title":"Query records","steps":[" /v1/tables/{tableId}/records/query with pageSize, sort, filter (eq, contains, gt, empty, and/or), search, fields, viewId; follow nextCursor."],"expected":"Correct records and paging; nextCursor null on the last page.","priority":"P1","kind":"API"},{"id":"M28-05","module":"M28","title":"Read one record","steps":[" /v1/tables/{tableId}/records/{recordId}?fields=fld_a,fld_b."],"expected":"That record with the asked fields.","priority":"P2","kind":"API"},{"id":"M28-06","module":"M28","title":"Group","steps":[" /v1/tables/{tableId}/records/group."],"expected":"Grouped counts/aggregates.","priority":"P3","kind":"API"},{"id":"M28-07","module":"M28","title":"Create, update, delete","steps":[" /v1/tables/{tableId}/records;  /v1/tables/{tableId}/records/{id};  /v1/tables/{tableId}/records/{id}; use field names and IDs; typecast true for a select option name."],"expected":"Works; changes appear live in the UI and in record history as “via API”.","priority":"P1","kind":"API"},{"id":"M28-08","module":"M28","title":"Batches of 500","steps":[" /v1/tables/{tableId}/records/batch with 500 records, then 501;  /v1/tables/{tableId}/records/batch;  /v1/tables/{tableId}/records/batch-delete."],"expected":"500 works; 501 refused with a clear error.","priority":"P1","kind":"Limit"},{"id":"M28-09","module":"M28","title":"Token types enforced","steps":["Use the Read-only token to create; the Write token to delete."],"expected":"403 with the missing type named.","priority":"P1","kind":"Security"},{"id":"M28-10","module":"M28","title":"Base limits enforced","steps":["Use the BASE-1-only token on BASE-2."],"expected":"404/403.","priority":"P1","kind":"Security"},{"id":"M28-11","module":"M28","title":"Revoked/expired tokens","steps":["Revoke a token and call the API; wait for an expired one."],"expected":"401 immediately.","priority":"P1","kind":"Security"},{"id":"M28-12","module":"M28","title":"Admin tokens","steps":["As ADMIN create a token; read WS-B data with it."],"expected":"Refused: an Admin’s token only reaches what the Admin was given. Admin sees only their own tokens.","priority":"P1","kind":"Security"},{"id":"M28-13","module":"M28","title":"Non-record APIs refused","steps":["Call e.g. /v1/workspaces with a token."],"expected":"403 “API tokens can only call the record API”.","priority":"P2","kind":"Security"},{"id":"M28-14","module":"M28","title":"Synced tables are read-only","steps":["Write to a synced table via API."],"expected":"403.","priority":"P2","kind":"API"},{"id":"M28-15","module":"M28","title":"Errors","steps":["Send invalid JSON, an unknown field, a stale version, a missing token."],"expected":"400/422 listing the problem; 409 for a stale version (the message says which version the record is at); 401 without token. Each error's “type” is a link to Help → API reference on this TableOS.","priority":"P2","kind":"API"},{"id":"M28-16","module":"M28","title":"Version","steps":["GET /v1/version without a token; check the x-tableos-version header on any response."],"expected":"Both show the running version.","priority":"P3","kind":"API"},{"id":"M28-17","module":"M28","title":"Rate per token","steps":["Send 30 requests in one second with one token (plan: Free 5/s, Team 20/s)."],"expected":"About 5 succeed on Free (20 on Team); the rest get 429 with a retry-after header and a message naming the limit. Requests a few per second are never limited.","priority":"P2","kind":"Limit"},{"id":"M28-18","module":"M28","title":"Field names in responses","steps":["GET …/records and POST …/records/query with a token.","Repeat with ?returnFieldsByFieldId=true (or \"returnFieldsByFieldId\": true in the body)."],"expected":"Records are keyed by field name with option names for selects (e.g. \"Status\": \"Active\"). With the flag: field IDs and option IDs.","priority":"P1","kind":"API"},{"id":"M28-19","module":"M28","title":"List records with GET","steps":["GET /v1/tables/{tableId}/records?pageSize=5&fields=Name in a browser-like client."],"expected":"Records and nextCursor; GET on …/records/query says to use POST (405).","priority":"P2","kind":"API"},{"id":"M28-20","module":"M28","title":"URL and header variants","steps":["Base URL ending in “/” (//v1/…), a trailing slash, a token without the word Bearer, a token in quotes."],"expected":"All work. A wrong path is refused with a message listing what tokens can call.","priority":"P2","kind":"API"},{"id":"M28-21","module":"M28","title":"Changes via API in history","steps":["Create or edit a record with a token; open the record’s history in TableOS."],"expected":"The entries are tagged “Via API”; edits made in the app are not.","priority":"P2","kind":"API"},{"id":"M28-22","module":"M28","title":"Help → API reference samples","steps":["Open Help → API reference; compare a sample with a real call."],"expected":"Every endpoint has request and response samples that match what the API returns (field names, error bodies).","priority":"P3","kind":"API"},{"id":"M29-01","module":"M29","title":"Sign-in rate limit","steps":["From one IP try 11 wrong sign-ins for an Owner within 15 minutes."],"expected":"429 “Too many attempts” after 10.","priority":"P2","kind":"Limit"},{"id":"M29-02","module":"M29","title":"Sign-up rate limit","steps":["(Production: 30 sign-ups per IP per hour.)"],"expected":"429 after the limit (optional).","priority":"P3","kind":"Limit"},{"id":"M29-03","module":"M29","title":"Import request size","steps":["Import a file with 2,000+ rows."],"expected":"Sent in chunks; all rows imported.","priority":"P2","kind":"Limit"},{"id":"M29-04","module":"M29","title":"Big base","steps":["A table with 30,000 records and 30 fields: scroll, filter, sort, group, search."],"expected":"Usable (record times; anything over ~3 s is worth reporting).","priority":"P1","kind":"Limit"},{"id":"M29-05","module":"M29","title":"Many people at once","steps":["5+ people edit the same base for 10 minutes."],"expected":"No lost edits, no errors, realtime keeps up.","priority":"P2","kind":"Limit"},{"id":"M29-06","module":"M29","title":"Text and name lengths","steps":["Names over 200 characters (workspace/base/automation), comments over 10,000 characters."],"expected":"Refused with a clear message.","priority":"P3","kind":"Limit"},{"id":"M29-07","module":"M29","title":"Server stays healthy","steps":["During heavy use ask the developer to watch logs (no out-of-memory or Redis errors)."],"expected":"No errors.","priority":"P2","kind":"Limit"},{"id":"M30-01","module":"M30","title":"OWNER","steps":["Open every workspace/base; Members & access; export; duplicate; move; delete."],"expected":"Everything allowed.","priority":"P1","kind":"Security"},{"id":"M30-02","module":"M30","title":"ADMIN","steps":["WS-A bases; WS-B bases; Members & access (Members only); billing."],"expected":"WS-A yes; WS-B no data; Members yes; billing no.","priority":"P1","kind":"Security"},{"id":"M30-03","module":"M30","title":"CREATOR (base)","steps":["Schema changes, automations, share links, interfaces; export; duplicate base."],"expected":"Schema/automations/share/interfaces yes; export and duplicate no.","priority":"P1","kind":"Security"},{"id":"M30-04","module":"M30","title":"EDITOR (base)","steps":["Edit records, shared views, import; fields/tables; share links; automations."],"expected":"Records, views, import yes; fields/tables, share links, automations no.","priority":"P1","kind":"Security"},{"id":"M30-05","module":"M30","title":"COMMENTER (base)","steps":["Comment; personal views; edit cells."],"expected":"Comment and personal views yes; editing no.","priority":"P1","kind":"Security"},{"id":"M30-06","module":"M30","title":"VIEWER (workspace)","steps":["Read every base in WS-A; edit; comment."],"expected":"Read yes; edit/comment no.","priority":"P1","kind":"Security"},{"id":"M30-07","module":"M30","title":"DOMAIN (no access)","steps":["Home; any base URL."],"expected":"Nothing opens until given access.","priority":"P1","kind":"Security"},{"id":"M30-08","module":"M30","title":"Direct URLs and API","steps":["Paste URLs of things you shouldn’t see; call the API with a session (browser dev tools) for forbidden actions."],"expected":"404/403 everywhere; no data leaks in responses.","priority":"P1","kind":"Security"},{"id":"M31-01","module":"M31","title":"Help pages","steps":["Open every Help topic; follow links between them."],"expected":"Content matches what TableOS does; no broken links.","priority":"P3","kind":"UI"},{"id":"M31-02","module":"M31","title":"Release notes","steps":["Help → Release notes."],"expected":"Current version listed first.","priority":"P3","kind":"UI"},{"id":"M31-03","module":"M31","title":"Browsers","steps":["Repeat a short smoke test (sign in, edit a cell, open a record, create a view) in Chrome, Edge, Firefox and Safari."],"expected":"Works the same.","priority":"P2","kind":"UI"},{"id":"M31-04","module":"M31","title":"Small screens","steps":["Use a 1366×768 laptop screen and a tablet/phone width."],"expected":"Nothing important cut off; dialogs scroll.","priority":"P3","kind":"UI"},{"id":"M31-05","module":"M31","title":"Error messages","steps":["Throughout testing, note any message that is unclear, technical or in the wrong place."],"expected":"Messages are clear and say what to do.","priority":"P3","kind":"UI"},{"id":"M31-06","module":"M31","title":"Slow network","steps":["Chrome dev tools → Network → Slow 3G; use the app."],"expected":"Loading states shown; no duplicate actions.","priority":"P3","kind":"UI"},{"id":"M31-07","module":"M31","title":"Product name","steps":["Look through pages, emails, API errors (the “type” link), webhooks’ User-Agent and downloaded files."],"expected":"Everything says TableOS; no other product name appears anywhere.","priority":"P3","kind":"UI"}]}</script>
<script>
const PLAN = JSON.parse(document.getElementById("plan").textContent);
const STATUSES = [["", "Not run"], ["pass", "Pass"], ["fail", "Fail"], ["blocked", "Blocked"], ["na", "N/A"]];
const SEVS = ["", "Critical", "High", "Medium", "Low"];
const OTHER_PREFIX = "OTHER-";
let state = { meta: {}, results: {}, others: [] };

/* ---- storage: IndexedDB (screenshots are too big for localStorage) ---- */
// One store per plan version: a new plan starts with empty results instead of last round's.
const DB = "tableos-test-workbook-v" + PLAN.planVersion, STORE = "kv";
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function load() { const db = await idb(); return new Promise((res) => { const t = db.transaction(STORE).objectStore(STORE).get("state"); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); }); }
let saveTimer = null;
function save() { clearTimeout(saveTimer); document.getElementById("saved").textContent = "Saving…"; saveTimer = setTimeout(async () => { const db = await idb(); const tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(state, "state"); tx.oncomplete = () => { document.getElementById("saved").textContent = "Saved " + new Date().toLocaleTimeString(); renderNav(); renderSummary(); }; }, 300); }

/* ---- images: downscale to keep the export small ---- */
function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const max = 1600; const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res({ name: file.name || "screenshot.png", data: c.toDataURL("image/jpeg", 0.85), at: new Date().toISOString() }); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function result(id) { return (state.results[id] ||= { status: "", severity: "", notes: "", images: [] }); }

/* ---- rendering ---- */
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) e.setAttribute(k, v); } for (const k of kids.flat()) e.append(k?.nodeType ? k : document.createTextNode(k ?? "")); return e; };
function counts(list) { const c = { total: list.length, pass: 0, fail: 0, blocked: 0, na: 0, run: 0, p1fail: 0 }; for (const x of list) { const r = state.results[x.id]; const s = r?.status || ""; if (s) { c[s]++; c.run++; } if (s === "fail" && x.priority === "P1") c.p1fail++; } return c; }
function renderNav() {
  const nav = document.getElementById("nav"); nav.innerHTML = "";
  nav.append(el("a", { href: "#intro" }, "How to test", ""));
  for (const m of PLAN.modules) { const c = counts(PLAN.cases.filter((x) => x.module === m.id)); nav.append(el("a", { href: "#" + m.id }, el("span", {}, m.id + " " + m.title), el("span", { class: "cnt" + (c.fail ? " bad" : "") }, c.run + "/" + c.total + (c.fail ? " · " + c.fail + "✗" : "")))); }
  nav.append(el("a", { href: "#other" }, "Other findings", el("span", { class: "cnt" }, String(state.others.length))));
}
function renderSummary() {
  const c = counts(PLAN.cases); const box = document.getElementById("summary"); if (!box) return; box.innerHTML = "";
  for (const [label, n] of [["Run", c.run + " / " + c.total], ["Pass", c.pass], ["Fail", c.fail], ["P1 failures", c.p1fail], ["Blocked", c.blocked], ["N/A", c.na], ["Other findings", state.others.length]]) box.append(el("div", { class: "pill" }, el("b", {}, String(n)), label));
}
function caseCard(c, isOther = false) {
  const r = isOther ? c : result(c.id);
  const card = el("div", { class: "case", id: c.id, "data-status": r.status || "" });
  const head = isOther
    ? el("div", { class: "ch" }, el("span", { class: "cid" }, c.id), el("input", { value: c.title || "", placeholder: "Short title of the problem", style: "flex:1;font:inherit;border:1px solid #d9dde4;border-radius:6px;padding:4px 8px", oninput: (e) => { c.title = e.target.value; save(); } }), el("button", { onclick: () => { if (confirm("Remove this finding?")) { state.others = state.others.filter((o) => o !== c); save(); render(); } } }, "Remove"))
    : el("div", { class: "ch" }, el("span", { class: "cid" }, c.id), el("b", {}, c.title), el("span", { class: "tag " + c.priority }, c.priority), el("span", { class: "tag" }, c.kind));
  card.append(head);
  if (!isOther) { card.append(el("ol", {}, c.steps.map((s) => el("li", {}, s)))); card.append(el("div", { class: "exp" }, el("b", {}, "Expected: "), c.expected)); }
  const st = el("div", { class: "st" });
  for (const [v, label] of STATUSES) { if (isOther && v === "na") continue; const b = el("button", { "data-v": v, class: (r.status || "") === v ? "on" : "", onclick: () => { r.status = v; card.dataset.status = v; st.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.v === v)); sev.style.display = v === "fail" || isOther ? "" : "none"; save(); } }, label); st.append(b); }
  const sev = el("select", { title: "Severity", onchange: (e) => { r.severity = e.target.value; save(); } }, SEVS.map((s) => { const o = el("option", { value: s }, s || "Severity…"); if (s === (r.severity || "")) o.selected = true; return o; }));
  sev.style.display = r.status === "fail" || isOther ? "" : "none"; st.append(sev);
  card.append(st);
  const ta = el("textarea", { placeholder: isOther ? "Where, steps to reproduce, what you expected, what happened" : "What happened (for a failure: what you saw vs. what you expected, any error message)", oninput: (e) => { r.notes = e.target.value; save(); } }); ta.value = r.notes || ""; card.append(ta);
  const thumbs = el("div", { class: "thumbs" });
  const drawThumbs = () => { thumbs.innerHTML = ""; (r.images || []).forEach((im, i) => thumbs.append(el("figure", {}, el("img", { src: im.data, alt: im.name, title: im.name, onclick: () => { document.getElementById("zoom-img").src = im.data; document.getElementById("zoom").showModal(); } }), el("button", { title: "Remove", onclick: () => { r.images.splice(i, 1); drawThumbs(); save(); } }, "×")))); };
  const addFiles = async (files) => { for (const f of files) if (f.type.startsWith("image/")) { (r.images ||= []).push(await readImage(f)); } drawThumbs(); save(); };
  const picker = el("input", { type: "file", accept: "image/*", multiple: "", class: "hidden", onchange: (e) => addFiles(e.target.files) });
  const drop = el("div", { class: "drop", tabindex: "0", title: "Click here, then Ctrl+V to paste a screenshot",
    onpaste: (e) => { const files = [...e.clipboardData.items].filter((i) => i.type.startsWith("image/")).map((i) => i.getAsFile()); if (files.length) { e.preventDefault(); addFiles(files); } },
    ondragover: (e) => { e.preventDefault(); drop.classList.add("over"); }, ondragleave: () => drop.classList.remove("over"),
    ondrop: (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); } },
    "📷 Screenshots: click here and press Ctrl+V to paste, drag images here, or ", el("a", { href: "#", onclick: (e) => { e.preventDefault(); picker.click(); } }, "choose files"), picker);
  card.append(drop, thumbs); drawThumbs();
  return card;
}
let filters = { status: "all", priority: "all", q: "" };
function visible(c) { const s = state.results[c.id]?.status || ""; if (filters.status !== "all" && (filters.status === "todo" ? s !== "" : s !== filters.status)) return false; if (filters.priority !== "all" && c.priority !== filters.priority) return false; if (filters.q && !(c.id + " " + c.title + " " + c.steps.join(" ") + " " + c.expected).toLowerCase().includes(filters.q)) return false; return true; }
function render() {
  const main = document.getElementById("main"); main.innerHTML = "";
  const intro = el("details", { class: "intro", id: "intro", open: Object.keys(state.results).length ? null : "" }, el("summary", {}, el("b", {}, "How to test, accounts and test data")),
    el("ol", {}, PLAN.howTo.map((h) => el("li", {}, h))),
    el("table", {}, el("tr", {}, el("th", {}, "Severity"), el("th", {}, "Meaning")), PLAN.severity.map((s) => el("tr", {}, el("td", {}, s[0]), el("td", {}, s[1])))),
    el("table", {}, el("tr", {}, el("th", {}, "Account"), el("th", {}, "Type"), el("th", {}, "Set up")), PLAN.accounts.map((a) => el("tr", {}, a.map((x) => el("td", {}, x))))),
    el("table", {}, el("tr", {}, el("th", {}, "Data"), el("th", {}, "What")), PLAN.data.map((a) => el("tr", {}, a.map((x) => el("td", {}, x))))));
  main.append(el("div", { class: "summary", id: "summary" }), intro);
  const statusSel = el("select", { onchange: (e) => { filters.status = e.target.value; render(); } }, [["all", "All cases"], ["todo", "Not run yet"], ["pass", "Passed"], ["fail", "Failed"], ["blocked", "Blocked"], ["na", "N/A"]].map(([v, l]) => { const o = el("option", { value: v }, l); if (filters.status === v) o.selected = true; return o; }));
  const prSel = el("select", { onchange: (e) => { filters.priority = e.target.value; render(); } }, [["all", "All priorities"], ["P1", "P1 only"], ["P2", "P2 only"], ["P3", "P3 only"]].map(([v, l]) => { const o = el("option", { value: v }, l); if (filters.priority === v) o.selected = true; return o; }));
  const q = el("input", { placeholder: "Search cases…", value: filters.q, oninput: (e) => { filters.q = e.target.value.toLowerCase(); clearTimeout(q.t); q.t = setTimeout(render, 250); } });
  main.append(el("div", { class: "filters" }, statusSel, prSel, q, el("span", { class: "saved" }, PLAN.cases.length + " cases · plan " + PLAN.planVersion + " for TableOS " + PLAN.appVersion)));
  for (const m of PLAN.modules) {
    const list = PLAN.cases.filter((c) => c.module === m.id && visible(c)); if (!list.length) continue;
    const sec = el("section", { class: "mod", id: m.id }, el("h2", {}, m.id + " — " + m.title), el("p", { class: "goal" }, m.goal));
    if (m.setup.length) sec.append(el("div", { class: "setup" }, el("b", {}, "Before you start"), el("ul", {}, m.setup.map((s) => el("li", {}, s)))));
    list.forEach((c) => sec.append(caseCard(c))); main.append(sec);
  }
  const other = el("section", { class: "mod", id: "other" }, el("h2", {}, "Other findings"), el("p", { class: "goal" }, "Problems no case covers: add one per problem."));
  state.others.forEach((o) => other.append(caseCard(o, true)));
  other.append(el("button", { onclick: () => { state.others.push({ id: OTHER_PREFIX + String(state.others.length + 1).padStart(2, "0"), title: "", status: "fail", severity: "", notes: "", images: [] }); save(); render(); location.hash = "#other"; } }, "+ Add a finding"));
  main.append(other); renderNav(); renderSummary();
}

/* ---- export / import ---- */
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function stamp() { return new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-"); }
function exportJson() {
  const c = counts(PLAN.cases);
  const out = { kind: "tableos-test-results", planVersion: PLAN.planVersion, appVersionPlanned: PLAN.appVersion, exportedAt: new Date().toISOString(), meta: state.meta,
    summary: { total: c.total, run: c.run, pass: c.pass, fail: c.fail, blocked: c.blocked, na: c.na, p1Failures: c.p1fail, otherFindings: state.others.length },
    results: PLAN.cases.map((x) => ({ id: x.id, module: x.module, title: x.title, priority: x.priority, kind: x.kind, steps: x.steps, expected: x.expected, ...(state.results[x.id] || { status: "", severity: "", notes: "", images: [] }) })),
    otherFindings: state.others };
  download("tableos-test-results-" + stamp() + ".json", JSON.stringify(out, null, 1), "application/json");
}
function exportHtml() {
  const c = counts(PLAN.cases); const e = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const rowsOf = (list) => list.map((x) => { const r = state.results[x.id] || x; return '<div class="c ' + (r.status || "") + '"><h3>' + e(x.id) + " · " + e(x.title) + " <small>" + e(x.priority || "") + " · " + e((STATUSES.find((s) => s[0] === (r.status || "")) || [])[1]) + (r.severity ? " · " + e(r.severity) : "") + "</small></h3>" + (x.expected ? "<p><b>Expected:</b> " + e(x.expected) + "</p>" : "") + (r.notes ? "<p><b>What happened:</b> " + e(r.notes).replace(/\n/g, "<br>") + "</p>" : "") + (r.images || []).map((im) => '<img src="' + im.data + '">').join("") + "</div>"; }).join("");
  const problems = PLAN.cases.filter((x) => ["fail", "blocked"].includes(state.results[x.id]?.status));
  const html = '<!doctype html><meta charset="utf-8"><title>TableOS test report</title><style>body{font-family:Segoe UI,Arial;max-width:1000px;margin:20px auto;color:#1d2330} .c{border:1px solid #d9dde4;border-radius:8px;padding:8px 12px;margin:10px 0} .c.fail{border-left:5px solid #b42318} .c.blocked{border-left:5px solid #b7791f} img{max-width:100%;border:1px solid #d9dde4;border-radius:6px;margin:6px 0} td,th{border:1px solid #d9dde4;padding:4px 8px} table{border-collapse:collapse}</style>' +
    "<h1>TableOS test report</h1><p>" + e(state.meta.tester) + " · " + e(state.meta.env) + " · version " + e(state.meta.version) + " · " + e(state.meta.browser) + " · " + new Date().toLocaleString() + "</p>" +
    "<table><tr><th>Run</th><th>Pass</th><th>Fail</th><th>P1 failures</th><th>Blocked</th><th>N/A</th><th>Other findings</th></tr><tr><td>" + c.run + "/" + c.total + "</td><td>" + c.pass + "</td><td>" + c.fail + "</td><td>" + c.p1fail + "</td><td>" + c.blocked + "</td><td>" + c.na + "</td><td>" + state.others.length + "</td></tr></table>" +
    "<h2>Failed and blocked</h2>" + (rowsOf(problems) || "<p>None.</p>") + "<h2>Other findings</h2>" + (rowsOf(state.others) || "<p>None.</p>");
  download("tableos-test-report-" + stamp() + ".html", html, "text/html");
}
async function importJson(file) {
  const data = JSON.parse(await file.text());
  if (data.kind !== "tableos-test-results") { alert("That isn't an exported TableOS test file."); return; }
  if (!confirm("Replace the results in this browser with the ones in the file?")) return;
  state = { meta: data.meta || {}, results: {}, others: data.otherFindings || [] };
  for (const r of data.results || []) if (r.status || r.notes || (r.images || []).length) state.results[r.id] = { status: r.status || "", severity: r.severity || "", notes: r.notes || "", images: r.images || [] };
  save(); fillMeta(); render();
}
function fillMeta() { for (const k of ["tester", "env", "version", "browser"]) { const i = document.getElementById("m-" + k); i.value = state.meta[k] || ""; i.oninput = () => { state.meta[k] = i.value; save(); }; } }

document.getElementById("export-json").onclick = exportJson;
document.getElementById("export-html").onclick = exportHtml;
document.getElementById("import").onclick = () => document.getElementById("import-file").click();
document.getElementById("import-file").onchange = (e) => e.target.files[0] && importJson(e.target.files[0]);
document.getElementById("zoom").onclick = () => document.getElementById("zoom").close();
const fitHeader = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
addEventListener("resize", fitHeader); fitHeader();
load().then((s) => { if (s) state = { meta: s.meta || {}, results: s.results || {}, others: s.others || [] }; fillMeta(); render(); });
</script></body></html>
